name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes during clinic operating hours (IST 07:00–21:00 = UTC 01:30–15:30).
    # GitHub Actions cron runs in UTC. Render spins down after 15 min of inactivity.
    # Five overlapping schedules cover the full window without needing a matrix.
    - cron: '1,15,29,43,57 1-15 * * *'   # :01 :15 :29 :43 :57 — UTC 01:00–15:59
  workflow_dispatch:                        # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Wake up Render service
        run: |
          RESPONSE=$(curl --silent --write-out "\n%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "${{ secrets.RENDER_BACKEND_URL }}/health")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status : $HTTP_CODE"
          echo "Body   : $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Backend is warm."
          else
            echo "⚠️  Backend returned $HTTP_CODE — may be cold-starting."
            # Do NOT exit 1 — a non-2xx during cold start is expected and acceptable.
          fi
