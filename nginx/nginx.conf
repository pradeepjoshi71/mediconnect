# ─── nginx.conf — MediConnect Production ──────────────────────────────────────
#
# Features:
#   - HTTP → HTTPS redirect (port 80)
#   - SSL termination on port 443 (certificate paths are configurable)
#   - Per-route rate limiting:
#       /api/v1/auth/   →  20 req/min  (login brute-force protection)
#       /api/           → 300 req/min  (general API)
#       /               → 600 req/min  (frontend)
#   - Connection limit per IP (anti-DoS)
#   - Security headers (HSTS, X-Frame-Options, CSP, etc.)
#   - Gzip compression
#   - Proxy buffer tuning
#   - WebSocket upgrade support
#
# SSL Setup:
#   Place certificates in ./nginx/ssl/:
#     fullchain.pem   — certificate + chain (Let's Encrypt or CA-signed)
#     privkey.pem     — private key
#   See nginx/ssl/README.md for instructions.
#
# To run without SSL (development / behind a cloud load balancer):
#   Comment out the HTTPS server block and the redirect block.
# ─────────────────────────────────────────────────────────────────────────────

# Tune worker count to match host CPU count
worker_processes auto;

# Increase max open files for high concurrency
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
  use epoll;
}

http {
  # ── Logging ──────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time '
                  'urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── MIME types ───────────────────────────────────────────────────────────────
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Security ─────────────────────────────────────────────────────────────────
  server_tokens off;                  # hide nginx version
  client_max_body_size 15m;           # match backend JSON_BODY_LIMIT
  client_body_timeout 30s;
  client_header_timeout 30s;
  keepalive_timeout 75s;
  send_timeout 30s;

  # ── Gzip compression ─────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  # auth: 20 requests/min per IP — brute-force protection on login
  limit_req_zone  $binary_remote_addr zone=auth_limit:10m  rate=20r/m;
  # api:  300 requests/min per IP — general API (above Node.js app rate limit)
  limit_req_zone  $binary_remote_addr zone=api_limit:20m   rate=300r/m;
  # web:  600 requests/min per IP — frontend static assets
  limit_req_zone  $binary_remote_addr zone=web_limit:10m   rate=600r/m;

  # Connection limit: max 50 simultaneous connections per IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Proxy buffer tuning ───────────────────────────────────────────────────────
  proxy_buffering          on;
  proxy_buffer_size        16k;
  proxy_buffers            8 32k;
  proxy_busy_buffers_size  64k;

  # ── Upstreams ─────────────────────────────────────────────────────────────────
  upstream mediconnect_frontend {
    server frontend:4173;
    keepalive 16;
  }

  upstream mediconnect_backend {
    server backend:5000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  # Comment this block out if SSL is terminated upstream (cloud load balancer).
  server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge through (for certbot --webroot)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS main server ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    http2  on;
    server_name _;

    # ── SSL certificates ─────────────────────────────────────────────────────────
    # Replace with your actual domain/cert paths.
    # For Let's Encrypt: /etc/letsencrypt/live/<domain>/fullchain.pem
    # For self-signed:   ./nginx/ssl/fullchain.pem  (mounted at /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── SSL hardening ────────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ─────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()"    always;

    # Connection limit per IP
    limit_conn conn_limit 50;

    # ── Health check (internal — no auth required) ────────────────────────────────
    location = /nginx-health {
      access_log off;
      return 200 "ok";
    }

    # ── Auth routes — strict rate limiting ────────────────────────────────────────
    location /api/v1/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      limit_req_status 429;

      proxy_pass         http://mediconnect_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection       "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ── File upload route — larger body, longer timeout ───────────────────────────
    location /api/v1/storage/upload {
      client_max_body_size 20m;
      limit_req zone=api_limit burst=10 nodelay;

      proxy_pass         http://mediconnect_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection       "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ── General API routes ────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      limit_req_status 429;

      proxy_pass         http://mediconnect_backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection       "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # ── WebSocket (Socket.io) ─────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://mediconnect_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade          $http_upgrade;
      proxy_set_header   Connection       "Upgrade";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;        # 1 hour for long-lived WS connections
    }

    # ── Frontend static assets — long cache ───────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      limit_req zone=web_limit burst=60 nodelay;
      proxy_pass         http://mediconnect_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Connection       "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Cache static assets at the proxy layer
      proxy_cache_valid 200 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      expires 30d;
    }

    # ── Frontend SPA fallback ─────────────────────────────────────────────────────
    location / {
      limit_req zone=web_limit burst=60 nodelay;

      proxy_pass         http://mediconnect_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Connection       "";
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
